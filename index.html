<script type="module">

const MISSIONS = [
  { id: "pwa", title: "ホーム画面にこのアプリを追加する", hint: "iPhone：共有ボタン →「ホーム画面に追加」／Android：メニュー →「ホーム画面に追加」。できたら「やった」を押してください", self: true },

/* ---------- 日付 ---------- */
const pad = (n) => (n < 10 ? "0" : "") + n;
const ymd = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const P = (s) => { const a = s.split("-").map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const addDays = (s, n) => { const a = s.split("-").map(Number); return ymd(new Date(a[0], a[1] - 1, a[2] + n)); };
const diff = (a, b) => Math.round((P(b) - P(a)) / 864e5);
const lab = (s) => { const d = P(s); return (d.getMonth() + 1) + "月" + d.getDate() + "日（" + WD[d.getDay()] + "）"; };
function today() { return ymd(new Date()); }
function gurukon(y, m) {
  const w = [];
  for (let d = 1; d <= 31; d++) { const dt = new Date(y, m, d); if (dt.getMonth() !== m) break; if (dt.getDay() === 3) w.push(ymd(dt)); }
  return [w[0], w[2]];
}
function eventsAround(t) {
  const a = t.split("-").map(Number); let out = [];
  for (let k = -3; k <= 3; k++) { const dt = new Date(a[0], a[1] - 1 + k, 1); out = out.concat(gurukon(dt.getFullYear(), dt.getMonth())); }
  return out.sort();
}

/* ---------- 共通 ---------- */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function lsGet() { try { return localStorage.getItem(LS) || ""; } catch (e) { return ""; } }

function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove("show"), 2600); }

  };
}

let ME = null, IS_ADMIN = false, MEMBERS = [], TOPICS = [];

    : '<button class="btn block" data-act="claim">今日のボーナスを受け取る（+' + gain + "pt）</button>";
  const ev = eventsAround(t).filter((e) => e >= t)[0], dd = diff(t, ev), att = m.attendance.indexOf(ev) >= 0;
  const evBtn = dd === 0 ? (att ? '<span class="chip ok">出席済み</span>' : '<button class="btn sm" data-act="checkin">出席する</button>') : '<span class="chip">あと' + dd + "日</span>";
  const dc = doneCount(m), total = MISSIONS.length;
  return '<div class="stack"><div><p class="eyebrow">' + lab(t) + '</p><h1 class="hello">' + esc(m.nickname) + "さん、こんにちは</h1></div>" +
    '<section class="card"><div class="row"><div><p class="eyebrow">ログインスタンプ</p><p class="muted">連続 ' + (pos === 0 && !claimed ? 0 : m.streak) + '日目</p></div><div class="pts">' + points(m) + "<small>pt</small></div></div>" +
    '<div class="stamps" role="img" aria-label="7日分のスタンプ、' + pos + 'こ集まっています">' + stamps + '</div><p class="muted" style="margin-bottom:14px">7日そろうと、7日目に +50pt。</p>' + btn + "</section>" +

}

function vAttend(m) {
  const t = today(), evs = eventsAround(t), up = evs.filter((e) => e >= t).slice(0, 3), past = evs.filter((e) => e < t).slice(-4).reverse();
  const row = (e, isPast) => {
    const att = m.attendance.indexOf(e) >= 0; let right;
    if (att) right = '<span class="chip ok">出席済み</span>';
    else if (e === t) right = '<button class="btn sm" data-act="checkin">出席する</button>';
    else if (isPast) right = '<span class="chip">お休み</span>';

    return '<li><div class="main"><p class="name">' + lab(e) + '</p><p class="sub">9:00〜11:00</p></div>' + right + "</li>";
  };
  return '<div class="stack"><div><p class="eyebrow">グルコン</p><h1 class="hello">出席確認</h1><p class="muted">毎月 第1・第3水曜 9:00〜11:00。開催日の当日に、ボタンが押せます。</p></div>' +

    '<p class="muted">出席は ' + m.attendance.length + "回。来られなかった日は、アーカイブや質問でゆっくり追いつけます。</p></div>";
}

function vGacha(m) {

    '<p class="muted">これまでに ' + m.gachaCount + "回まわしました。</p></div>";
}

function vMission(m) {
  const dc = doneCount(m), all = dc === MISSIONS.length;
  const list = MISSIONS.map((ms) => {
    const d = isDone(m, ms); let right = "";
    if (ms.self && !d) right = '<button class="btn sm quiet" data-act="mission" data-id="' + ms.id + '">やった</button>';
    const hint = ms.hint ? '<p class="sub">' + ms.hint + "</p>" : (ms.auto && !d ? '<p class="sub">自動でチェックされます</p>' : "");
    return '<li class="mission"><span class="tick' + (d ? " on" : "") + '"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><div class="main"><p class="name">' + ms.title + "</p>" + hint + "</div>" + right + "</li>";
  }).join("");
  let rew;
  if (m.reward === "requested") rew = '<span class="chip brand">申し込み済み</span><p class="muted" style="margin-top:8px">れもんさんから、日程のご案内があります。</p>';
  else if (m.reward === "done") rew = '<span class="chip ok">対応済み</span>';

}

    } else {

        '<ul class="rows">' + TOPICS.map((x) => '<li><span class="hist-dot" style="--c:' + x.color + '"></span><span class="main">' + esc(x.text) + '</span><button class="btn sm ' + (pendingDel === x.id ? "" : "line") + '" data-act="del-topic" data-id="' + x.id + '">' + (pendingDel === x.id ? "本当に消す" : "消す") + "</button></li>").join("") + "</ul>";

function render() {
  const root = document.getElementById("app");
  if (booting) { root.innerHTML = '<div class="loading">読み込み中…</div>'; return; }
  if (IS_ADMIN) {
    root.innerHTML = '<header class="top"><div class="brand"><span class="dot"></span>かしこSNSスクール</div><div class="who"><span class="chip brand">管理者</span><button class="link" data-act="logout">ログアウト</button></div></header><main>' + vAdmin() + "</main>";
    return;
  }
  const m = ME;
  if (!m) { root.innerHTML = vLogin(); return; }
  const body = view === "home" ? vHome(m) : view === "att" ? vAttend(m) : view === "gacha" ? vGacha(m) : vMission(m);
  const tabs = [["home", "ホーム"], ["att", "出席"], ["gacha", "ガチャ"], ["mission", "ミッション"]];
  root.innerHTML = '<header class="top"><div class="brand"><span class="dot"></span>かしこSNSスクール</div><div class="who"><b>' + esc(m.nickname) + '</b><button class="link" data-act="logout">ログアウト</button></div></header><main>' + body + "</main>" +
    '<nav class="nav" aria-label="メニュー"><div class="nav-in">' + tabs.map((x) => '<button data-act="tab" data-v="' + x[0] + '"' + (view === x[0] ? ' aria-current="page"' : "") + '><span class="ico">' + svg(x[0]) + "</span>" + x[1] + "</button>").join("") + "</div></nav>";
}

/* ---------- データ ---------- */
async function loadTopics() {
  try { const s = await getDocs(collection(db, "topics")); TOPICS = s.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort(byOrder); }
  catch (e) { TOPICS = []; }
}
async function patch(fields) {
  if (!ME) return false;
  Object.assign(ME, fields);
  try { await updateDoc(memRef(ME.code), fields); return true; }
  catch (e) { console.error(e); toast("保存できませんでした。通信を確認して、もう一度ためしてください"); return false; }
}
function stopAdmin() { if (unsubM) unsubM(); if (unsubT) unsubT(); unsubM = unsubT = null; MEMBERS = []; }
function startAdmin() {
  stopAdmin(); IS_ADMIN = true; ME = null;
  unsubM = onSnapshot(query(collection(db, "members"), orderBy("createdAt", "desc")),
    (s) => { MEMBERS = s.docs.map((d) => norm(d.id, d.data())); render(); }, (e) => { console.error(e); toast(errMsg(e)); });
  unsubT = onSnapshot(collection(db, "topics"),
    (s) => { TOPICS = s.docs.map((d) => Object.assign({ id: d.id }, d.data())).sort(byOrder); render(); }, (e) => { console.error(e); });
}
async function startMember(code) {
  const snap = await getDoc(memRef(code));
  if (!snap.exists()) { const e = new Error("nocode"); e.code = "nocode"; throw e; }
  const m = norm(code, snap.data());
  if (!m.active) { const e = new Error("inactive"); e.code = "inactive"; throw e; }
  ME = m; IS_ADMIN = false; stopAdmin();
  if (m.lastLogin !== today()) { try { await updateDoc(memRef(code), { lastLogin: today() }); ME.lastLogin = today(); } catch (e) { console.error(e); } }
  await loadTopics();
}
async function boot(user) {
  const seq = ++bootSeq;
  try {
    if (user && !user.isAnonymous) {
      if ((user.email || "").toLowerCase() === ADMIN_EMAIL) { startAdmin(); }
      else { await signOut(auth); loginErr = "このGoogleアカウントは、管理者として登録されていません。"; ME = null; IS_ADMIN = false; }
    } else {
      const code = lsGet();
      if (!user && code) { await signInAnonymously(auth); return; }   // 続きは onAuthStateChanged で
      if (user && code && !ME) await startMember(code);
      if (!code) { ME = null; IS_ADMIN = false; }
    }
  } catch (e) {
    if (e && (e.code === "nocode" || e.code === "inactive")) { lsSet(""); loginErr = e.code === "inactive" ? "このコードは、いまお休み中です。" : "このコードは見つかりません。"; }
    else { loginErr = errMsg(e); }
    ME = null;
  }
  if (seq !== bootSeq) return;
  booting = false; render();
}
onAuthStateChanged(auth, (user) => { if (busy) return; boot(user); });

/* ---------- 操作 ---------- */
function genCode() {
  const ch = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let c = "KSK-";
  for (let i = 0; i < 6; i++) c += ch[Math.floor(Math.random() * ch.length)];
  return c;
}
function pick() {
  let pool = topicList().filter((x) => x.id !== lastDraw);
  if (!pool.length) pool = topicList();
  return pool[Math.floor(Math.random() * pool.length)];
}
async function doLogin(codeRaw, nick) {
  const code = normCode(codeRaw);
  if (!code) { loginErr = "招待コードを入れてください。"; return render(); }
  busy = true; loginErr = ""; render();
  try {
    if (!auth.currentUser) await signInAnonymously(auth);
    const snap = await getDoc(memRef(code));
    if (!snap.exists()) { loginErr = "このコードは見つかりません。れもんさんに確認してください。"; return; }
    const m = norm(code, snap.data());
    if (!m.active) { loginErr = "このコードは、いまお休み中です。"; return; }
    const fields = { lastLogin: today() };
    if (!m.nickname) { if (!nick) { loginErr = "はじめての方は、ニックネームも入れてください。"; return; } fields.nickname = nick; }
    await updateDoc(memRef(code), fields);
    ME = Object.assign(m, fields); IS_ADMIN = false; lsSet(code);
    await loadTopics(); view = "home"; loginErr = "";
    toast(ME.nickname + "さん、ようこそ");
  } catch (e) { console.error(e); loginErr = errMsg(e); }
  finally { busy = false; booting = false; render(); }
}

const A = {
  logout: async () => { lsSet(""); ME = null; IS_ADMIN = false; stopAdmin(); view = "home"; loginErr = ""; try { await signOut(auth); } catch (e) { /* そのまま */ } booting = false; render(); },
  "admin-login": async () => {
    loginErr = "";

  },
  tab: (el) => { view = el.dataset.v; reveal = false; render(); window.scrollTo(0, 0); },

    const m = ME, t = today();
    if (!m || (m.lastBonus && m.lastBonus >= t)) return;
    const streak = m.lastBonus === addDays(t, -1) ? m.streak + 1 : 1, gain = 10 + (streak % 7 === 0 ? 50 : 0);
    const ok = await patch({ streak, bonusPts: m.bonusPts + gain, lastBonus: t, bonusDays: m.bonusDays.concat([t]) });
    render(); if (ok) toast("+" + gain + "pt もらいました");
  },
  checkin: async () => {
    const m = ME, t = today();
    if (!m) return;
    if (eventsAround(t).indexOf(t) < 0) { toast("今日はグルコンの日ではありません"); return; }
    if (m.attendance.indexOf(t) >= 0) return;
    const ok = await patch({ attendance: m.attendance.concat([t]) });
    render(); if (ok) toast("出席を記録しました。おつかれさまです");
  },
  spin: () => {
    if (rolling || !ME) return;
    rolling = true; reveal = false; render();
    setTimeout(async () => {
      const t = pick(); rolling = false; lastDraw = t.id; reveal = true;
      await patch({ gachaCount: ME.gachaCount + 1, gachaLog: ME.gachaLog.concat([t.id]).slice(-30) });
      render();
    }, 700);
  },
  "copy-draw": () => { const t = lastDraw && topicById(lastDraw); if (t) copyText(t.text); },
  mission: async (el) => { if (!ME) return; const ok = await patch({ missions: Object.assign({}, ME.missions, { [el.dataset.id]: true }) }); render(); if (ok) toast("ナイスです"); },
  reward: async () => { if (!ME) return; const ok = await patch({ reward: "requested" }); render(); if (ok) toast("申し込みました"); },

  adm: (el) => { adm = el.dataset.v; pendingDel = null; render(); },
  "new-code": async () => {
    busy = true; render();
    try {
      let c, tries = 0;
      do { c = genCode(); tries++; } while ((await getDoc(memRef(c))).exists() && tries < 5);
      await setDoc(memRef(c), { nickname: "", active: true, bonusPts: 0, streak: 0, lastBonus: "", bonusDays: [], lastLogin: "", attendance: [], missions: { pwa: false, post: false }, gachaCount: 0, gachaLog: [], reward: "none", createdAt: Date.now() });
      newCode = c;
    } catch (e) { console.error(e); toast(errMsg(e)); }
    busy = false; render();
  },
  "copy-invite": (el) => copyText(inviteText(el.dataset.code)),
  toggle: async (el) => { const x = MEMBERS.find((m) => m.code === el.dataset.code); if (x) try { await updateDoc(memRef(x.code), { active: !x.active }); } catch (e) { toast(errMsg(e)); } },
  "reward-done": async (el) => { try { await updateDoc(memRef(el.dataset.code), { reward: "done" }); toast("対応済みにしました"); } catch (e) { toast(errMsg(e)); } },
  "del-member": async (el) => {
    const c = el.dataset.code;
    if (pendingDel !== c) { pendingDel = c; render(); return; }
    pendingDel = null;
    try { await deleteDoc(memRef(c)); toast("削除しました"); } catch (e) { toast(errMsg(e)); render(); }
  },
  mark: async (el) => {
    const x = MEMBERS.find((m) => m.code === el.dataset.code); if (!x) return;
    const on = x.attendance.indexOf(admEvent) >= 0, next = on ? x.attendance.filter((d) => d !== admEvent) : x.attendance.concat([admEvent]);
    try { await updateDoc(memRef(x.code), { attendance: next }); } catch (e) { toast(errMsg(e)); }
  },
  "seed-topics": async () => {
    busy = true; render();
    try { const b = writeBatch(db); DEFAULT_TOPICS.forEach((t) => b.set(doc(db, "topics", t.id), { text: t.text, color: t.color, cname: t.cname, order: t.order })); await b.commit(); toast("登録しました"); }
    catch (e) { console.error(e); toast(errMsg(e)); }
    busy = false; render();
  },
  "del-topic": async (el) => {
    const id = el.dataset.id;
    if (pendingDel !== id) { pendingDel = id; render(); return; }
    pendingDel = null;
    try { await deleteDoc(doc(db, "topics", id)); } catch (e) { toast(errMsg(e)); render(); }
  }
};
document.addEventListener("click", (e) => { const el = e.target.closest("[data-act]"); if (el && A[el.dataset.act]) A[el.dataset.act](el); });
document.addEventListener("change", (e) => { const el = e.target.closest("[data-change]"); if (el && el.dataset.change === "event") { admEvent = el.value; render(); } });
document.addEventListener("submit", async (e) => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  if (f.dataset.form === "login") { if (busy) return; doLogin(document.getElementById("code").value, document.getElementById("nick").value.trim()); }
  if (f.dataset.form === "topic") {
    const inp = document.getElementById("newTopic"), v = inp.value.trim(); if (!v) return;
    const n = TOPICS.length, p = PAL[n % PAL.length];
    try { await setDoc(doc(db, "topics", "t" + Date.now()), { text: v, color: p.c, cname: p.n, order: Date.now() }); toast("お題を足しました"); }
    catch (err) { console.error(err); toast(errMsg(err)); }
  }
});

if ("serviceWorker" in navigator) { window.addEventListener("load", () => { navigator.serviceWorker.register("./sw.js").catch(() => {}); }); }
</script>
